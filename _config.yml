title: SmartdogX
name: Zhiyuan Xi
description: "Personal essays, notes on physics, and life along the way. A bilingual notebook by Zhiyuan Xi, a physics PhD student at Penn State."
url: "https://smartdogx.github.io"
baseurl: ""
lang: en
email: zkx5112@psu.edu
timezone: America/New_York
author:
  name: Zhiyuan Xi
  avatar: /assets/images/profile_photo.webp
research_url: https://sites.psu.edu/smartdpgxzy/
scholar_url: https://scholar.google.com/citations?user=tS8aCiAAAAAJ
github_url: https://github.com/smartdogX
zhihu_url: https://www.zhihu.com/people/xzy-48-9

# Keep the original category-based addresses for every existing post.
permalink: /:categories/:title/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  math_engine: mathjax

include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .tools
  - .preview
  - scripts
  - node_modules

plugins:
  - jekyll-sitemap
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      topic: reflections
      lang: en
  - scope:
      path: _pages
      type: pages
    values:
      layout: single
      lang: en

feed:
  path: feed.xml
