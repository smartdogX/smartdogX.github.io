<footer id="footer" class="site-footer shell">
  <div class="footer-top">
    <div><a class="footer-name" href="{{ home_url | relative_url }}">Zhiyuan Xi <span>/ SmartdogX</span></a><p>{{ ui.footer_note }}</p></div>
    <nav aria-label="{{ ui.elsewhere }}" class="footer-links">
      <a href="{{ site.scholar_url }}">{{ ui.scholar }} ↗</a>
      <a href="{{ site.github_url }}">GitHub ↗</a>
      <a href="{{ site.zhihu_url }}">{% if ui_lang == 'zh-CN' %}知乎{% else %}Zhihu{% endif %} ↗</a>
      <a href="mailto:{{ site.email }}">{{ ui.email }} ↗</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS ↗</a>
    </nav>
  </div>
  <div class="footer-bottom"><span>© {{ site.time | date: '%Y' }} Zhiyuan Xi</span><span>{{ ui.footer_built }} <a href="https://jekyllrb.com/">Jekyll</a>{% if ui_lang == 'zh-CN' %} 构建。{% else %}.{% endif %}</span></div>
</footer>
